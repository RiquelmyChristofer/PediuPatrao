<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card shadow-sm w-100" style="max-width: 440px;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Recuperar senha</h1>
            <div class="alert alert-success" th:if="${solicitado}">
                Se houver uma conta associada a esse e-mail, enviaremos um link de redefinição.
                Verifique também a pasta de spam.
            </div>
            <p class="text-muted">Informe o e-mail cadastrado na sua conta.</p>
            <form th:action="@{/esqueceu-senha}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email" name="email" type="email" class="form-control" required maxlength="254">
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar link de recuperação</button>
            </form>
            <a th:href="@{/login}" class="d-block text-center mt-3">Voltar ao login</a>
        </div>
    </section>
</main>
</body>
</html>
