<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Dashboard</title></head>
<body>
<div th:fragment="content" id="dashboard-root">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Dashboard administrativo</h2>
        <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="dash-auto">
                <label class="form-check-label" for="dash-auto">Atualizar a cada 60 s</label>
            </div>
            <small class="text-muted" id="dash-atualizado" aria-live="polite">—</small>
            <button class="btn btn-outline-primary btn-sm" type="button" id="dash-atualizar">
                <i class="bi bi-arrow-clockwise"></i> Atualizar
            </button>
        </div>
    </div>

    <div id="dash-erro-global" class="alert alert-danger d-none" role="alert"></div>

    <!-- RF05 — Filtros de consulta -->
    <section class="card shadow-sm mb-4" aria-label="Filtros">
        <div class="card-body">
            <form id="dash-filtros" class="row g-3 align-items-end" novalidate>
                <div class="col-6 col-md-2">
                    <label class="form-label" for="f-inicio">Data inicial</label>
                    <input type="date" class="form-control" id="f-inicio" required>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label" for="f-fim">Data final</label>
                    <input type="date" class="form-control" id="f-fim" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="f-status">Status do pedido</label>
                    <select class="form-select" id="f-status"><option value="">Todos</option></select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="f-categoria">Categoria de produto</label>
                    <select class="form-select" id="f-categoria"><option value="">Todas</option></select>
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1" type="submit">Aplicar</button>
                    <button class="btn btn-outline-secondary" type="button" id="f-limpar" title="Limpar filtros">Limpar</button>
                </div>
                <div class="col-12 d-flex flex-wrap gap-2">
                    <span class="text-muted small align-self-center">Atalhos:</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-atalho="hoje">Hoje</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-atalho="7">7 dias</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-atalho="30">30 dias</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-atalho="mes">Este mês</button>
                </div>
                <div class="col-12"><div id="f-erro" class="text-danger small d-none" role="alert"></div></div>
            </form>
        </div>
    </section>

    <!-- RF01 — Indicadores gerais -->
    <section class="row g-3 mb-4" aria-label="Indicadores gerais" id="kpis">
        <div class="col-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body">
            <div class="text-muted small">Faturamento</div>
            <div class="fs-4 fw-bold" id="k-faturamento">—</div>
            <div class="small" id="k-faturamento-var"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body">
            <div class="text-muted small">Pedidos válidos</div>
            <div class="fs-4 fw-bold" id="k-pedidos">—</div>
            <div class="small" id="k-pedidos-var"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body">
            <div class="text-muted small">Ticket médio</div>
            <div class="fs-4 fw-bold" id="k-ticket">—</div>
            <div class="small text-muted" id="k-itens"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body">
            <div class="text-muted small">Cancelamentos</div>
            <div class="fs-4 fw-bold" id="k-cancelados">—</div>
            <div class="small text-muted" id="k-descontos"></div></div></div></div>
    </section>

    <!-- RF02 — Análise de vendas -->
    <section class="row g-3 mb-4" aria-label="Análise de vendas">
        <div class="col-12 col-xl-8">
            <div class="card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Vendas no período</span>
                    <select class="form-select form-select-sm w-auto" id="f-agrupamento" aria-label="Agrupamento">
                        <option value="dia">Por dia</option>
                        <option value="semana">Por semana</option>
                        <option value="mes">Por mês</option>
                    </select>
                </div>
                <div class="card-body position-relative" data-secao="vendas">
                    <div class="dash-estado text-muted small"></div>
                    <div style="height:300px"><canvas id="c-vendas" aria-label="Gráfico de vendas no período" role="img"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-xl-4">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Situação dos pedidos</div>
                <div class="card-body" data-secao="status">
                    <div class="dash-estado text-muted small"></div>
                    <div style="height:300px"><canvas id="c-status" aria-label="Pedidos por status" role="img"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Horários de maior movimento</div>
                <div class="card-body" data-secao="horas">
                    <div class="dash-estado text-muted small"></div>
                    <div style="height:260px"><canvas id="c-horas" aria-label="Pedidos por hora" role="img"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Faturamento por categoria</div>
                <div class="card-body" data-secao="categorias">
                    <div class="dash-estado text-muted small"></div>
                    <div style="height:260px"><canvas id="c-categorias" aria-label="Faturamento por categoria" role="img"></canvas></div>
                </div>
            </div>
        </div>
    </section>

    <!-- RF04 — Produtos mais vendidos / RF03 — pedidos recentes -->
    <section class="row g-3 mb-5">
        <div class="col-12 col-xl-6">
            <div class="card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Produtos mais vendidos</span>
                    <select class="form-select form-select-sm w-auto" id="f-ordenar" aria-label="Ordenar ranking">
                        <option value="quantidade">Por quantidade</option>
                        <option value="receita">Por receita</option>
                    </select>
                </div>
                <div class="card-body" data-secao="ranking">
                    <div class="dash-estado text-muted small"></div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead><tr><th>#</th><th>Produto</th><th>Categoria</th>
                                <th class="text-end">Qtde</th><th class="text-end">Receita</th></tr></thead>
                            <tbody id="t-ranking"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-xl-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Pedidos recentes</div>
                <div class="card-body" data-secao="recentes">
                    <div class="dash-estado text-muted small"></div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead><tr><th>Entrada</th><th>Cliente</th><th>Itens</th><th>Status</th>
                                <th class="text-end">Total</th></tr></thead>
                            <tbody id="t-recentes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script th:src="@{/plugins/chart.js/Chart.min.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</div>
</body>
</html>
