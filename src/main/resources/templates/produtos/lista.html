<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Produtos</h2>
    </div>

    <div id="produto-feedback" class="alert d-none" role="alert"></div>

    <section class="card shadow-sm mb-4" th:if="${perfilAdmin}">
        <div class="card-header fw-bold">Cadastrar produto</div>
        <div class="card-body">
            <form id="produtoForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control" required maxlength="120">
                    </div>
                    <div class="col-md-3">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" name="tipo" class="form-select" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Lanche">Lanche</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Porção">Porção</option>
                            <option value="Adicional">Adicional</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" id="preco" name="preco" class="form-control"
                               min="0.01" step="0.01" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" id="ativo" name="ativo" class="form-check-input" checked>
                            <label for="ativo" class="form-check-label">Ativo</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Cadastrar produto</button>
            </form>
        </div>
    </section>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th><th>Tipo</th><th>Preço</th><th>Ativo</th>
                    <th th:if="${perfilAdmin}">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td th:colspan="${perfilAdmin ? 5 : 4}" class="text-center text-muted py-4">
                        Nenhum produto cadastrado.
                    </td>
                </tr>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.tipo}"></td>
                    <td th:text="${produto.preco == null ? '—' : 'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${produto.ativo == true ? 'Sim' : 'Não'}"></td>
                    <td th:if="${perfilAdmin}">
                        <button type="button" class="btn btn-sm btn-outline-primary btn-editar-produto"
                                data-bs-toggle="modal" data-bs-target="#editarProdutoModal"
                                th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo}">
                            Editar
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-excluir-produto"
                                th:attr="data-id=${produto.id},data-nome=${produto.nome}">
                            Excluir
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="editarProdutoModal" tabindex="-1" aria-labelledby="editarProdutoTitulo" aria-hidden="true"
         th:if="${perfilAdmin}">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editarProdutoForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editarProdutoTitulo">Editar produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editarProdutoId">
                        <div class="mb-3">
                            <label for="editarProdutoNome" class="form-label">Nome</label>
                            <input type="text" id="editarProdutoNome" class="form-control" required maxlength="120">
                        </div>
                        <div class="mb-3">
                            <label for="editarProdutoTipo" class="form-label">Tipo</label>
                            <select id="editarProdutoTipo" class="form-select" required>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editarProdutoPreco" class="form-label">Preço (R$)</label>
                            <input type="number" id="editarProdutoPreco" class="form-control"
                                   min="0.01" step="0.01" required>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="editarProdutoAtivo" class="form-check-input">
                            <label for="editarProdutoAtivo" class="form-check-label">Ativo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (() => {
            const feedback = document.getElementById('produto-feedback');
            const token = document.querySelector('meta[name="_csrf"]')?.content;
            const headerName = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-XSRF-TOKEN';

            function mostrarErro(mensagem) {
                feedback.className = 'alert alert-danger';
                feedback.textContent = mensagem;
            }

            document.getElementById('produtoForm')?.addEventListener('submit', async event => {
                event.preventDefault();
                const form = event.currentTarget;
                const dados = Object.fromEntries(new FormData(form));
                dados.ativo = form.elements.ativo.checked;
                dados.preco = Number(dados.preco);
                try {
                    const response = await fetch('/api/produtos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', [headerName]: token },
                        body: JSON.stringify(dados)
                    });
                    await window.apiFeedback.verificarRespostaApi(response, 'Não foi possível cadastrar o produto.');
                    window.location.reload();
                } catch (error) {
                    mostrarErro(window.apiFeedback.mensagemFalha(error, 'Não foi possível cadastrar o produto.'));
                }
            });

            document.querySelectorAll('.btn-editar-produto').forEach(button => {
                button.addEventListener('click', () => {
                    document.getElementById('editarProdutoId').value = button.dataset.id;
                    document.getElementById('editarProdutoNome').value = button.dataset.nome || '';
                    document.getElementById('editarProdutoTipo').value = button.dataset.tipo || '';
                    document.getElementById('editarProdutoPreco').value = button.dataset.preco || '';
                    document.getElementById('editarProdutoAtivo').checked = button.dataset.ativo === 'true';
                });
            });

            document.getElementById('editarProdutoForm')?.addEventListener('submit', async event => {
                event.preventDefault();
                const id = document.getElementById('editarProdutoId').value;
                const dados = {
                    nome: document.getElementById('editarProdutoNome').value,
                    tipo: document.getElementById('editarProdutoTipo').value,
                    preco: Number(document.getElementById('editarProdutoPreco').value),
                    ativo: document.getElementById('editarProdutoAtivo').checked
                };
                try {
                    const response = await fetch(`/api/produtos/${encodeURIComponent(id)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', [headerName]: token },
                        body: JSON.stringify(dados)
                    });
                    await window.apiFeedback.verificarRespostaApi(response, 'Não foi possível atualizar o produto.');
                    window.location.reload();
                } catch (error) {
                    mostrarErro(window.apiFeedback.mensagemFalha(error, 'Não foi possível atualizar o produto.'));
                }
            });

            document.querySelectorAll('.btn-excluir-produto').forEach(button => {
                button.addEventListener('click', async () => {
                    if (!window.confirm(`Excluir o produto "${button.dataset.nome}"?`)) return;
                    try {
                        const response = await fetch(`/api/produtos/${encodeURIComponent(button.dataset.id)}`, {
                            method: 'DELETE',
                            headers: { [headerName]: token }
                        });
                        await window.apiFeedback.verificarRespostaApi(response, 'Não foi possível excluir o produto.');
                        window.location.reload();
                    } catch (error) {
                        mostrarErro(window.apiFeedback.mensagemFalha(error, 'Não foi possível excluir o produto.'));
                    }
                });
            });
        })();
    </script>
</div>
</body>
</html>
