<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Registro de Auditoria</h2>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr><th>Data/Hora</th><th>Usuário</th><th>Perfil</th><th>Ação</th><th>Entidade</th><th>ID</th><th>Detalhes</th><th>Alterações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}"><td colspan="8" class="text-center text-muted py-4">Nenhum registro de auditoria.</td></tr>
                    <tr th:each="registro : ${registros}">
                        <td th:text="${registro.dataHora}"></td>
                        <td th:text="${registro.usuario}"></td>
                        <td th:text="${registro.perfil}"></td>
                        <td th:text="${registro.acao}"></td>
                        <td th:text="${registro.entidade}"></td>
                        <td th:text="${registro.entidadeId}"></td>
                        <td th:text="${registro.detalhes}"></td>
                        <td>
                            <ul class="mb-0 ps-3">
                                <li th:each="campo : ${registro.camposAlterados}"
                                    th:text="${campo.campo + ': ' + (campo.valorAnterior == null ? '—' : campo.valorAnterior) + ' → ' + (campo.valorNovo == null ? '—' : campo.valorNovo)}"></li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
