# Arquivo opcional de configuração local; mantenha credenciais fora do Git.
spring.config.import=optional:file:.env[.properties]

# Configure MONGODB_URI no ambiente; fallback local para desenvolvimento.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# Configure SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD and MAIL_FROM in the environment.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:}
