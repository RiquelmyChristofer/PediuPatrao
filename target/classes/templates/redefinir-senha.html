<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir nova senha - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card shadow-sm w-100" style="max-width: 440px;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Definir nova senha</h1>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
            <form th:if="${tokenValido}" th:action="@{/redefinir-senha}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label for="senha" class="form-label">Nova senha</label>
                    <input id="senha" name="senha" type="password" class="form-control"
                           required minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">Confirme a nova senha</label>
                    <input id="confirmarSenha" name="confirmarSenha" type="password" class="form-control"
                           required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
            </form>
            <div class="text-muted" th:unless="${tokenValido}">
                Solicite um novo link de recuperação para continuar.
            </div>
            <a th:href="@{/esqueceu-senha}" class="d-block text-center mt-3">Solicitar outro link</a>
        </div>
    </section>
</main>
</body>
</html>
